name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      
      - name: Lint with ruff
        run: |
          python -m ruff check app
      
      - name: Type check with mypy
        run: |
          python -m mypy app --ignore-missing-imports
      
      - name: Run migrations
        run: |
          python -m alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./test.db
      
      - name: Run tests
        run: |
          python -m pytest tests/ -v --junit-xml=test-results.xml
        env:
          DATABASE_URL: sqlite:///./test.db
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: npm run lint
      
      - name: Type check
        run: npm run type-check
      
      - name: Run tests
        run: npm test -- --run --reporter=junit --outputFile=test-results.xml
      
      - name: Build
        run: npm run build
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: frontend/test-results.xml

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4
      
      - name: Build backend image
        run: docker build -t dim-rim-backend ./backend
      
      - name: Build frontend image
        run: docker build -t dim-rim-frontend -f frontend/Dockerfile .
      
      - name: Test docker-compose
        run: |
          docker compose config
          docker compose build
